<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WoW Classic Party Planner - Sasha's Choice</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: #181b20;
            --border-color: #2a2e37;
            --accent-gold: #f8b700;
            --text-main: #e1e4e8;
            --text-muted: #8b949e;
            --danger-red: #ff4d4d;
            --success-green: #2ec4b6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 2px solid var(--accent-gold);
            margin-bottom: 25px;
        }

        h1 {
            color: var(--accent-gold);
            margin: 0 0 10px 0;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .section {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        h2 {
            margin-top: 0;
            color: var(--accent-gold);
            font-size: 1.3rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 15px;
        }

        .player-card {
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .player-name {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .badge {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .badge-veteran { background-color: #3b82f6; color: white; }
        .badge-newbie { background-color: #ec4899; color: white; }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        select {
            width: 100%;
            padding: 8px;
            background-color: #0f1115;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-main);
            font-size: 0.95rem;
            margin-bottom: 5px;
            box-sizing: border-box;
        }

        select:focus {
            outline: 1px solid var(--accent-gold);
        }

        .veto-tag {
            font-size: 0.8rem;
            color: var(--danger-red);
            min-height: 18px;
        }

        .status-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }

        .warning-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        .warning-item {
            padding: 10px 12px;
            border-radius: 4px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            font-size: 0.9rem;
        }

        .warning-item.danger {
            background-color: rgba(255, 77, 77, 0.15);
            border-left: 4px solid var(--danger-red);
            color: #ff9999;
        }

        .warning-item.success {
            background-color: rgba(46, 196, 182, 0.15);
            border-left: 4px solid var(--success-green);
            color: #80ed99;
        }

        .summary-stats {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
        }

        .stat-badge {
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        .stat-badge span {
            font-weight: bold;
            color: var(--accent-gold);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>WoW Classic Party Planner</h1>
        <div class="subtitle">Sasha: Pick classes for the group!</div>
    </header>

    <!-- Class Assignment Section -->
    <div class="section">
        <h2>Assign Classes</h2>
        <div class="grid" id="assignment-grid"></div>
    </div>

    <!-- Rule Validations & Warnings -->
    <div class="status-box">
        <h2>Composition Rules Check</h2>
        <ul class="warning-list" id="warning-list"></ul>
        <div class="summary-stats" id="summary-stats"></div>
    </div>
</div>

<script>
    // ----------------------------------------------------
    // HARDCODED CONFIGURATION
    // Modify player vetoes here ('None' or exact class name)
    // ----------------------------------------------------
    const HARDCODED_VETOES = {
        'Slava': 'Warrior',
        'Evgen': 'Mage',
        'Nikita': 'None',
        'Kolyan': 'None',
        'Natasha': 'None'
    };

    const PARTY_CONFIG = [
        { name: 'Slava', isNewbie: false },
        { name: 'Evgen', isNewbie: false },
        { name: 'Nikita', isNewbie: false },
        { name: 'Kolyan', isNewbie: false },
        { name: 'Natasha', isNewbie: false },
        { name: 'Sasha', isNewbie: true }
    ];

    const CLASSES = {
        'Warrior': { armor: 'Plate', role: 'Melee', canTank: true, canHeal: false },
        'Paladin': { armor: 'Plate', role: 'Melee', canTank: true, canHeal: true },
        'Hunter': { armor: 'Mail', role: 'Ranged', canTank: false, canHeal: false },
        'Rogue': { armor: 'Leather', role: 'Melee', canTank: false, canHeal: false },
        'Priest': { armor: 'Cloth', role: 'Ranged', canTank: false, canHeal: true },
        'Shaman': { armor: 'Mail', role: 'Hybrid', canTank: false, canHeal: true },
        'Mage': { armor: 'Cloth', role: 'Ranged', canTank: false, canHeal: false },
        'Warlock': { armor: 'Cloth', role: 'Ranged', canTank: false, canHeal: false },
        'Druid': { armor: 'Leather', role: 'Hybrid', canTank: true, canHeal: true }
    };

    const state = {
        assignments: {}
    };

    PARTY_CONFIG.forEach(p => {
        state.assignments[p.name] = '';
    });

    function initUI() {
        const assignmentGrid = document.getElementById('assignment-grid');
        assignmentGrid.innerHTML = '';

        PARTY_CONFIG.forEach(player => {
            const bannedClass = HARDCODED_VETOES[player.name] || 'None';
            const hasVeto = !player.isNewbie && bannedClass !== 'None';

            const assignCard = document.createElement('div');
            assignCard.className = 'player-card';
            assignCard.innerHTML = `
                <div class="player-header">
                    <span class="player-name">${player.name}</span>
                    <span class="badge ${player.isNewbie ? 'badge-newbie' : 'badge-veteran'}">
                        ${player.isNewbie ? 'Newbie' : 'Veteran'}
                    </span>
                </div>
                <label>Assigned Class:</label>
                <select id="assign-${player.name}" onchange="handleAssignChange('${player.name}', this.value)">
                    <option value="">-- Select Class --</option>
                    ${Object.keys(CLASSES).map(c => {
                        const isDisabled = (c === bannedClass);
                        return `<option value="${c}" ${isDisabled ? 'disabled' : ''}>${c}${isDisabled ? ' (Vetoed)' : ''}</option>`;
                    }).join('')}
                </select>
                <div class="veto-tag">
                    ${hasVeto ? `Banned: ${bannedClass}` : ''}
                </div>
            `;
            assignmentGrid.appendChild(assignCard);
        });

        validateParty();
    }

    function handleAssignChange(playerName, value) {
        state.assignments[playerName] = value;
        validateParty();
    }

    function validateParty() {
        const warningList = document.getElementById('warning-list');
        const summaryStats = document.getElementById('summary-stats');
        warningList.innerHTML = '';

        const assignedPlayers = Object.entries(state.assignments).filter(([_, className]) => className !== '');
        const selectedClasses = assignedPlayers.map(([_, className]) => className);
        const warnings = [];

        if (selectedClasses.length < PARTY_CONFIG.length) {
            warnings.push({
                type: 'danger',
                msg: `Assigned ${selectedClasses.length} of ${PARTY_CONFIG.length} players.`
            });
        }

        // Role Counts
        let meleeCount = 0;
        let rangedCount = 0;
        selectedClasses.forEach(c => {
            if (CLASSES[c].role === 'Melee') meleeCount++;
            if (CLASSES[c].role === 'Ranged') rangedCount++;
        });

        if (meleeCount > 3) {
            warnings.push({ type: 'danger', msg: `Too many melee classes selected (${meleeCount}/3 max)!` });
        }
        if (rangedCount > 3) {
            warnings.push({ type: 'danger', msg: `Too many ranged classes selected (${rangedCount}/3 max)!` });
        }

        // Armor coverage check
        const armorTypes = new Set(selectedClasses.map(c => CLASSES[c].armor));
        const requiredArmor = ['Cloth', 'Leather', 'Mail', 'Plate'];
        const missingArmor = requiredArmor.filter(a => !armorTypes.has(a));

        if (missingArmor.length > 0 && selectedClasses.length > 0) {
            warnings.push({ type: 'danger', msg: `Missing armor types: ${missingArmor.join(', ')}.` });
        }

        // Distinct Tank and Healer check
        const tankCandidates = assignedPlayers.filter(([_, c]) => CLASSES[c].canTank).map(([name, _]) => name);
        const healerCandidates = assignedPlayers.filter(([_, c]) => CLASSES[c].canHeal).map(([name, _]) => name);

        const hasTankCandidate = tankCandidates.length > 0;
        const hasHealerCandidate = healerCandidates.length > 0;

        let validRoleAssignment = false;
        if (hasTankCandidate && hasHealerCandidate) {
            for (let tankPerson of tankCandidates) {
                for (let healerPerson of healerCandidates) {
                    if (tankPerson !== healerPerson) {
                        validRoleAssignment = true;
                        break;
                    }
                }
                if (validRoleAssignment) break;
            }
        }

        if (selectedClasses.length > 0) {
            if (!hasTankCandidate) {
                warnings.push({ type: 'danger', msg: `No Tank class assigned! Need Warrior, Paladin, or Druid.` });
            }
            if (!hasHealerCandidate) {
                warnings.push({ type: 'danger', msg: `No Healer class assigned! Need Priest, Paladin, Shaman, or Druid.` });
            }
            if (hasTankCandidate && hasHealerCandidate && !validRoleAssignment) {
                warnings.push({ type: 'danger', msg: `Tank and Healer must be assigned to two DIFFERENT players!` });
            }
        }

        if (warnings.length === 0 && selectedClasses.length === PARTY_CONFIG.length) {
            warnings.push({ type: 'success', msg: `Party composition is fully valid and balanced! Ready to go!` });
        }

        warnings.forEach(w => {
            const li = document.createElement('li');
            li.className = `warning-item ${w.type}`;
            li.innerText = w.msg;
            warningList.appendChild(li);
        });

        summaryStats.innerHTML = `
            <div class="stat-badge">Melee: <span>${meleeCount}</span></div>
            <div class="stat-badge">Ranged: <span>${rangedCount}</span></div>
            <div class="stat-badge">Armor Types: <span>${armorTypes.size}/4</span></div>
            <div class="stat-badge">Distinct Tank & Healer: <span>${validRoleAssignment ? 'Yes' : 'No'}</span></div>
        `;
    }

    initUI();
</script>

</body>
</html>
